backend:
  replicaCount: 2

  image:
    repository: 427025827458.dkr.ecr.ap-south-1.amazonaws.com/three-tier-backend
    tag: v1
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 5001

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi


frontend:
  replicaCount: 2

  image:
    repository: 427025827458.dkr.ecr.ap-south-1.amazonaws.com/three-tier-frontend
    tag: latest
    pullPolicy: Always

  service:
    type: NodePort
    port: 80
    nodePort: 30080
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi


imagePullSecrets:
  - name: ecr-registry-secret


backendConfig:
  port: "5001"
  dbHost: "three-tier-postgres.c9ymqqoskr6i.ap-south-1.rds.amazonaws.com"
  dbPort: "5432"
  dbName: "taskdb"
